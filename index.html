<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Agents Fundamentals</title>

    <style>
        :root {
            --fondo: #f4f5f7;
            --tarjeta: #ffffff;
            --texto: #202124;
            --secundario: #667085;
            --principal: #405cf5;
            --principal-suave: #eef1ff;
            --borde: #e4e7ec;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--fondo);
            color: var(--texto);
            font-family: Arial, Helvetica, sans-serif;
        }

        .contenedor {
            width: min(950px, calc(100% - 32px));
            margin: 0 auto;
            padding: 38px 0 80px;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 5vw, 42px);
        }

        .descripcion {
            margin: 0;
            color: var(--secundario);
            line-height: 1.5;
        }

        .reproductor {
            position: sticky;
            top: 10px;
            z-index: 20;
            padding: 18px;
            margin-bottom: 24px;
            border: 1px solid var(--borde);
            border-radius: 16px;
            background: var(--tarjeta);
            box-shadow: 0 8px 25px rgba(16, 24, 40, 0.1);
        }

        audio {
            width: 100%;
        }

        .estado {
            margin-top: 10px;
            color: var(--secundario);
            font-size: 14px;
        }

        .transcripcion {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .segmento {
            display: grid;
            grid-template-columns: 75px 1fr;
            gap: 16px;
            padding: 17px;
            border: 1px solid var(--borde);
            border-radius: 12px;
            background: var(--tarjeta);
            cursor: pointer;
            transition:
                border-color 0.2s,
                background-color 0.2s,
                transform 0.2s;
        }

        .segmento:hover {
            border-color: var(--principal);
            transform: translateY(-1px);
        }

        .segmento.activo {
            border-color: var(--principal);
            background: var(--principal-suave);
        }

        .tiempo {
            color: var(--principal);
            font-family: Consolas, monospace;
            font-weight: bold;
        }

        .texto {
            margin: 0;
            font-size: 17px;
            line-height: 1.65;
        }

        @media (max-width: 600px) {
            .contenedor {
                width: min(100% - 20px, 950px);
                padding-top: 20px;
            }

            .segmento {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .texto {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <header>
            <h1>AI Agents Fundamentals</h1>

            <p class="descripcion">
                Seleccioná cualquier fragmento para reproducir el audio
                desde ese punto.
            </p>
        </header>

        <section class="reproductor">
            <audio
                id="audio"
                src="AIAgentsFundamentals3.mp3"
                controls
                preload="metadata"
            ></audio>

            <div class="estado" id="estado">
                89 fragmentos · idioma detectado:
                en
            </div>
        </section>

        <section
            id="transcripcion"
            class="transcripcion"
        ></section>
    </main>

    <script>
        const segmentos = [{"id": 1, "inicio": 0.0, "fin": 6.76, "marca": "00:00", "texto": "So first, what is an LLM? Is it different from AI? And how is ChatGPT related to all of this?"}, {"id": 2, "inicio": 7.04, "fin": 12.56, "marca": "00:07", "texto": "LLMs stand for Large Language Models, which is a type of neural network that's trained on"}, {"id": 3, "inicio": 12.56, "fin": 18.32, "marca": "00:12", "texto": "massive amounts of text data. It's generally trained on data that can be found online."}, {"id": 4, "inicio": 18.48, "fin": 23.34, "marca": "00:18", "texto": "Everything from web scraping to books to transcripts, anything that is text-based"}, {"id": 5, "inicio": 23.34, "fin": 28.3, "marca": "00:23", "texto": "can be trained into a large language model. And taking a step back, what is a neural network?"}, {"id": 6, "inicio": 28.3, "fin": 33.54, "marca": "00:28", "texto": "A neural network is essentially a series of algorithms that try to recognize patterns"}, {"id": 7, "inicio": 33.54, "fin": 37.94, "marca": "00:33", "texto": "in data. And really what they're trying to do is simulate how the human brain works."}, {"id": 8, "inicio": 38.32, "fin": 43.82, "marca": "00:38", "texto": "And LLMs are a specific type of neural network that focus on understanding natural language."}, {"id": 9, "inicio": 44.0, "fin": 49.52, "marca": "00:44", "texto": "And as mentioned, LLMs learn by reading tons of books, articles, internet texts,"}, {"id": 10, "inicio": 49.58, "fin": 55.18, "marca": "00:49", "texto": "and there's really no limitation there. And so how do LLMs differ from traditional programming?"}, {"id": 11, "inicio": 55.18, "fin": 60.56, "marca": "00:55", "texto": "Well, with traditional programming, it's instruction-based, which means if X,"}, {"id": 12, "inicio": 60.84, "fin": 66.14, "marca": "01:00", "texto": "then Y. You're explicitly telling the computer what to do. You're giving it a set of instructions"}, {"id": 13, "inicio": 66.14, "fin": 71.36, "marca": "01:06", "texto": "to execute. But with LLMs, it's a completely different story. You're teaching the computer"}, {"id": 14, "inicio": 71.36, "fin": 77.04, "marca": "01:11", "texto": "not how to do things, but how to learn how to do things. And this is a much more flexible approach"}, {"id": 15, "inicio": 77.04, "fin": 82.48, "marca": "01:17", "texto": "and is really good for a lot of different applications where previously traditional"}, {"id": 16, "inicio": 82.48, "fin": 87.76, "marca": "01:22", "texto": "coding could not accomplish them. So one example application is image recognition."}, {"id": 17, "inicio": 87.98, "fin": 94.64, "marca": "01:27", "texto": "With image recognition, traditional programming would require you to hard code every single rule"}, {"id": 18, "inicio": 94.64, "fin": 101.98, "marca": "01:34", "texto": "for how to, let's say, identify different letters. So A, B, C, D. But if you're handwriting these"}, {"id": 19, "inicio": 101.98, "fin": 105.72, "marca": "01:41", "texto": "letters, everybody's handwritten letters look different. So how do you use traditional"}, {"id": 20, "inicio": 105.72, "fin": 111.32, "marca": "01:45", "texto": "programming to identify every single possible variation? Well, that's where this AI approach"}, {"id": 21, "inicio": 111.32, "fin": 116.28, "marca": "01:51", "texto": "comes in. Instead of giving a computer explicit instructions for how to identify a handwritten"}, {"id": 22, "inicio": 116.28, "fin": 122.04, "marca": "01:56", "texto": "letter, you instead give it a bunch of examples of what handwritten letters look like, and then it"}, {"id": 23, "inicio": 122.04, "fin": 127.5, "marca": "02:02", "texto": "can infer what a new handwritten letter looks like based on all of the examples that it has."}, {"id": 24, "inicio": 127.64, "fin": 132.22, "marca": "02:07", "texto": "What also sets machine learning and large language models apart in this new approach to programming"}, {"id": 25, "inicio": 132.22, "fin": 137.92, "marca": "02:12", "texto": "is that they are much more flexible, much more adaptable, meaning they can learn from their"}, {"id": 26, "inicio": 138.6, "fin": 145.14, "marca": "02:18", "texto": "inaccuracies and are thus so much more scalable than traditional programming. LLMs are incredibly"}, {"id": 27, "inicio": 145.14, "fin": 151.5, "marca": "02:25", "texto": "powerful at a wide range of tasks, including summarization, text generation, creative writing,"}, {"id": 28, "inicio": 151.76, "fin": 157.44, "marca": "02:31", "texto": "question and answer, programming. And if you've watched any of my videos, you know how powerful"}, {"id": 29, "inicio": 157.44, "fin": 163.08, "marca": "02:37", "texto": "these large language models can be. And they're only getting better. Know that right now, large"}, {"id": 30, "inicio": 163.08, "fin": 168.56, "marca": "02:43", "texto": "language models and AI in general are the worst they'll ever be. And as we're generating more data"}, {"id": 31, "inicio": 168.56, "fin": 173.46, "marca": "02:48", "texto": "on the internet, and as we use synthetic data, which means data created by other large language"}, {"id": 32, "inicio": 173.46, "fin": 178.42, "marca": "02:53", "texto": "models, these models are going to get better rapidly. And it's super exciting to think about"}, {"id": 33, "inicio": 178.42, "fin": 182.68, "marca": "02:58", "texto": "what the future holds. Now let's talk a little bit about the history and evolution of large"}, {"id": 34, "inicio": 182.68, "fin": 186.62, "marca": "03:02", "texto": "language models. We're going to cover just a few of the large language models today in this section."}, {"id": 35, "inicio": 186.62, "fin": 192.9, "marca": "03:06", "texto": "The history of LLMs traces all the way back to the ELISA model, which was from 1966,"}, {"id": 36, "inicio": 193.16, "fin": 198.9, "marca": "03:13", "texto": "which was really the first language model. It had pre-programmed answers based on keywords. It had"}, {"id": 37, "inicio": 198.9, "fin": 203.88, "marca": "03:18", "texto": "a very limited understanding of the English language. And like many early language models,"}, {"id": 38, "inicio": 203.96, "fin": 208.82, "marca": "03:23", "texto": "you started to see holes in its logic after a few back and forths in a conversation. And then after"}, {"id": 39, "inicio": 208.82, "fin": 213.6, "marca": "03:28", "texto": "that, language models really didn't evolve for a very long time. Although technically the first"}, {"id": 40, "inicio": 213.6, "fin": 220.52, "marca": "03:33", "texto": "recurrent neural network was created in 1924, or RNN, they weren't really able to learn until 1972."}, {"id": 41, "inicio": 220.8, "fin": 227.04, "marca": "03:40", "texto": "And these new learning language models are a series of neural networks with layers and weights and a"}, {"id": 42, "inicio": 227.04, "fin": 232.44, "marca": "03:47", "texto": "whole bunch of stuff that I'm not going to get into in this video. And RNNs were really the first"}, {"id": 43, "inicio": 232.44, "fin": 238.02, "marca": "03:52", "texto": "technology that was able to predict the next word in a sentence rather than having everything"}, {"id": 44, "inicio": 238.02, "fin": 243.1, "marca": "03:58", "texto": "pre-programmed for it. And that was really the basis for how current large language models work."}, {"id": 45, "inicio": 243.1, "fin": 248.58, "marca": "04:03", "texto": "And even after this and the advent of deep learning in the early 2000s, the field of AI"}, {"id": 46, "inicio": 248.58, "fin": 255.98, "marca": "04:08", "texto": "evolved very slowly with language models far behind what we see today. This all changed in 2017,"}, {"id": 47, "inicio": 256.04, "fin": 261.98, "marca": "04:16", "texto": "where the Google DeepMind team released a research paper about a new technology called Transformers."}, {"id": 48, "inicio": 262.04, "fin": 267.72, "marca": "04:22", "texto": "And this paper was called Attention is All You Need. And a quick side note, I don't think Google"}, {"id": 49, "inicio": 267.72, "fin": 273.26, "marca": "04:27", "texto": "even knew quite what they had published at that time. But that same paper is what led OpenAI to"}, {"id": 50, "inicio": 273.26, "fin": 279.38, "marca": "04:33", "texto": "develop ChatGPT. So obviously, other computer scientists saw the potential for the Transformers"}, {"id": 51, "inicio": 279.38, "fin": 283.62, "marca": "04:39", "texto": "architecture. With this new Transformers architecture, it was far more advanced,"}, {"id": 52, "inicio": 283.8, "fin": 287.96, "marca": "04:43", "texto": "it required decreased training time, and it had many other features like self-attention,"}, {"id": 53, "inicio": 288.14, "fin": 292.8, "marca": "04:48", "texto": "which I'll cover later in this video. Transformers allowed for pre-trained large language models like"}, {"id": 54, "inicio": 293.36, "fin": 300.42, "marca": "04:53", "texto": "which was developed by OpenAI in 2018. It had 117 million parameters, and it was completely"}, {"id": 55, "inicio": 300.42, "fin": 307.32, "marca": "05:00", "texto": "revolutionary, but soon to be outclassed by other LLMs. Then after that, BERT was released, B-E-R-T,"}, {"id": 56, "inicio": 307.36, "fin": 314.26, "marca": "05:07", "texto": "in 2018. That had 340 million parameters and had bidirectionality, which means it had the ability"}, {"id": 57, "inicio": 314.26, "fin": 321.16, "marca": "05:14", "texto": "to process text in both directions, which helped it have a better understanding of context. And as"}, {"id": 58, "inicio": 321.16, "fin": 326.02, "marca": "05:21", "texto": "comparison, a unidirectional model only has an understanding of the words that came before the"}, {"id": 59, "inicio": 326.02, "fin": 332.36, "marca": "05:26", "texto": "target text. And after this, LLMs didn't develop a lot of new technology, but they did increase"}, {"id": 60, "inicio": 332.36, "fin": 340.74, "marca": "05:32", "texto": "greatly in scale. GPT-2 was released in early 2019 and had 2.5 billion parameters. Then GPT-3 in June"}, {"id": 61, "inicio": 340.74, "fin": 346.86, "marca": "05:40", "texto": "of 2020 with 175 billion parameters. And it was at this point that the public started noticing"}, {"id": 62, "inicio": 346.86, "fin": 352.3, "marca": "05:46", "texto": "large language models. GPT had a much better understanding of natural language than any of"}, {"id": 63, "inicio": 352.3, "fin": 357.72, "marca": "05:52", "texto": "its predecessors. And this is the type of model that powers ChatGPT, which is probably the model"}, {"id": 64, "inicio": 357.72, "fin": 363.22, "marca": "05:57", "texto": "that you're most familiar with. And ChatGPT became so popular because it was so much more accurate"}, {"id": 65, "inicio": 363.22, "fin": 368.62, "marca": "06:03", "texto": "than anything anyone had ever seen before. And it was really because of its size. And because it was"}, {"id": 66, "inicio": 368.62, "fin": 374.1, "marca": "06:08", "texto": "now built into this chatbot format, anybody could jump in and really understand how to interact with"}, {"id": 67, "inicio": 374.1, "fin": 380.8, "marca": "06:14", "texto": "this model. ChatGPT 3.5 came out in December of 2022 and started this current wave of AI that we"}, {"id": 68, "inicio": 380.8, "fin": 388.32, "marca": "06:20", "texto": "see today. Then in March 2023, GPT-4 was released and it was incredible and still is incredible to"}, {"id": 69, "inicio": 388.32, "fin": 396.06, "marca": "06:28", "texto": "this day. It had a whopping reported 1.76 trillion parameters and uses likely a mixture of experts"}, {"id": 70, "inicio": 396.06, "fin": 401.9, "marca": "06:36", "texto": "approach, which means it has multiple models that are all fine tuned for specific use cases. And"}, {"id": 71, "inicio": 401.9, "fin": 406.84, "marca": "06:41", "texto": "when somebody asks a question to it, it chooses which of those models to use. And then they added"}, {"id": 72, "inicio": 406.84, "fin": 410.98, "marca": "06:46", "texto": "multimodality and a bunch of other features. And that brings us to where we are today."}, {"id": 73, "inicio": 411.18, "fin": 415.98, "marca": "06:51", "texto": "Alright, now let's talk about how LLMs actually work in a little bit more detail. The process"}, {"id": 74, "inicio": 415.98, "fin": 421.4, "marca": "06:55", "texto": "of how large language models work can be split into three steps. The first of these steps is"}, {"id": 75, "inicio": 421.4, "fin": 427.96, "marca": "07:01", "texto": "called tokenization. And there are neural networks that are trained to split long text into individual"}, {"id": 76, "inicio": 427.96, "fin": 433.64, "marca": "07:07", "texto": "tokens. And a token is essentially about three fourths of a word. So if it's a shorter word like"}, {"id": 77, "inicio": 433.64, "fin": 439.74, "marca": "07:13", "texto": "high or that or there, it's probably just one token. But if you have a longer word like"}, {"id": 78, "inicio": 439.74, "fin": 445.12, "marca": "07:19", "texto": "summarization, it's going to be split into multiple pieces. And the way that tokenization happens is"}, {"id": 79, "inicio": 445.12, "fin": 450.04, "marca": "07:25", "texto": "actually different for every model. Some of them separate prefixes and suffixes. Let's look at an"}, {"id": 80, "inicio": 450.6, "fin": 458.74, "marca": "07:30", "texto": "What is the tallest building? So what is the tall est building are all separate tokens. And so that"}, {"id": 81, "inicio": 458.74, "fin": 464.3, "marca": "07:38", "texto": "separates the suffix off of tallest but not building because it is taking the context into account."}, {"id": 82, "inicio": 464.4, "fin": 469.36, "marca": "07:44", "texto": "And this step is done so models can understand each word individually, just like humans. We"}, {"id": 83, "inicio": 469.36, "fin": 475.5, "marca": "07:49", "texto": "understand each word individually and as groupings of words. And then the second step of LLMs is"}, {"id": 84, "inicio": 475.5, "fin": 480.62, "marca": "07:55", "texto": "something called embeddings. The large language models turns those tokens into embedding vectors,"}, {"id": 85, "inicio": 481.02, "fin": 485.98, "marca": "08:01", "texto": "turning those tokens into essentially a bunch of numerical representations of those tokens"}, {"id": 86, "inicio": 485.98, "fin": 491.5, "marca": "08:05", "texto": "numbers. And this makes it significantly easier for the computer to read and understand each word"}, {"id": 87, "inicio": 491.5, "fin": 496.54, "marca": "08:11", "texto": "and how the different words relate to each other. And these numbers all correspond with the position"}, {"id": 88, "inicio": 496.54, "fin": 501.54, "marca": "08:16", "texto": "in an embeddings vector database. And then the final step in the process is transformers,"}, {"id": 89, "inicio": 501.54, "fin": 503.1, "marca": "08:21", "texto": "which we'll get to in a little bit."}];

        const audio = document.getElementById("audio");
        const contenedor = document.getElementById("transcripcion");

        let indiceActivo = -1;

        function escaparHtml(texto) {
            const elemento = document.createElement("div");
            elemento.textContent = texto;
            return elemento.innerHTML;
        }

        function mostrarTranscripcion() {
            segmentos.forEach((segmento, indice) => {
                const articulo = document.createElement("article");

                articulo.className = "segmento";
                articulo.dataset.indice = indice;

                articulo.innerHTML = `
                    <span class="tiempo">
                        ${segmento.marca}
                    </span>

                    <p class="texto">
                        ${escaparHtml(segmento.texto)}
                    </p>
                `;

                articulo.addEventListener("click", () => {
                    audio.currentTime = segmento.inicio;
                    audio.play();
                });

                contenedor.appendChild(articulo);
            });
        }

        function actualizarFragmento() {
            const tiempo = audio.currentTime;

            const nuevoIndice = segmentos.findIndex((segmento) => {
                return (
                    tiempo >= segmento.inicio &&
                    tiempo < segmento.fin
                );
            });

            if (
                nuevoIndice === -1 ||
                nuevoIndice === indiceActivo
            ) {
                return;
            }

            const anterior = document.querySelector(
                ".segmento.activo"
            );

            if (anterior) {
                anterior.classList.remove("activo");
            }

            const actual = document.querySelector(
                `.segmento[data-indice="${nuevoIndice}"]`
            );

            if (actual) {
                actual.classList.add("activo");

                actual.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
            }

            indiceActivo = nuevoIndice;
        }

        mostrarTranscripcion();

        audio.addEventListener(
            "timeupdate",
            actualizarFragmento
        );
    </script>
</body>
</html>
